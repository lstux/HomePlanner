name: ESP32-C6 firmware build

on:
  push:
    paths:
      - "platform/esp32c6/**"
      - "platform/twatch/homeplanner/hp_core.*"
      - "protocol/**"
      - ".github/workflows/esp32c6-build.yml"
  pull_request:
    paths:
      - "platform/esp32c6/**"
      - "platform/twatch/homeplanner/hp_core.*"
      - "protocol/**"
      - ".github/workflows/esp32c6-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Screen tests (host)
        run: |
          mkdir -p /tmp/aj
          curl -fsSL -o /tmp/aj/ArduinoJson.h https://github.com/bblanchon/ArduinoJson/releases/download/v6.21.5/ArduinoJson-v6.21.5.h
          cd platform/esp32c6
          g++ -std=c++17 -Wall -Wextra -g -fsanitize=address,undefined -I/tmp/aj -Itest_firmware/src tests/screen_tests.cpp test_firmware/src/screen.cpp test_firmware/src/draw.cpp test_firmware/src/life.cpp test_firmware/src/hp_core_link.cpp -o /tmp/screen_tests
          /tmp/screen_tests
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build ESP32-C6 firmware
        working-directory: platform/esp32c6/test_firmware
        run: pio run
