name: Protocol core tests

on:
  push:
    paths:
      - "protocol/**"
      - "platform/central/sd/**"
      - "platform/central/tests/**"
      - "platform/central/src/pairing.h"
      - ".github/workflows/protocol-tests.yml"
  pull_request:
    paths:
      - "protocol/**"
      - "platform/central/sd/**"
      - "platform/central/tests/**"
      - "platform/central/src/pairing.h"
      - ".github/workflows/protocol-tests.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S protocol -B build/protocol
      - name: Build
        run: cmake --build build/protocol --parallel
      - name: Test
        run: ctest --test-dir build/protocol --output-on-failure
      - name: SD adapter on real files (FreeRTOS stubbed)
        run: |
          sudo mkdir -p /sd/hp-smoke && sudo chown -R "$USER" /sd
          g++ -std=gnu++11 -Wall -Wextra -g -fsanitize=address,undefined \
            -Iplatform/central/tests/stubs -Iprotocol/include -Iplatform/central/sd \
            platform/central/tests/sd_journal_tests.cpp protocol/src/*.cpp platform/central/sd/sd_*.cpp \
            -o build/sd_journal_tests
          build/sd_journal_tests
      - name: Pairing registry
        run: |
          g++ -std=c++17 -Wall -Wextra -g -fsanitize=address,undefined -Iplatform/central/src \
            platform/central/tests/pairing_tests.cpp -o build/pairing_tests
          build/pairing_tests
