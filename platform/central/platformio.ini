; Centrale Home : un tronc commun (src/) et un dossier par carte (boards/<carte>/).
; Ajouter une carte : voir README.md. « pio run » compile toutes les cartes, « pio run -e <carte> » une seule.
[platformio]
default_envs = waveshare-c6, lilygo-t-hmi

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    HomePlannerProtocol

[common]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Isrc
    -I../../protocol/include
    -Isd

[env:waveshare-c6]
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = boards/waveshare_c6/partitions.csv
build_flags =
    ${common.build_flags}
    -Iboards/waveshare_c6
build_src_filter = +<*> +<../boards/waveshare_c6/>

[env:lilygo-t-hmi]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = boards/lilygo_thmi/partitions.csv
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -Iboards/lilygo_thmi
build_src_filter = +<*> +<../boards/lilygo_thmi/>
