<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#243b35">
  <meta name="description" content="Tableau de bord familial local-first Home.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Home</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⌂</span><strong>Home</strong></div>
    <button id="open-settings" class="icon-button" type="button" aria-label="Réglages">⚙️</button>
  </header>

  <main id="home">
    <nav id="members" class="chips" aria-label="Qui es-tu ?"></nav>
    <select id="routine-select" aria-label="Routine"></select>

    <section class="mascot-zone">
      <p id="speech" class="speech" role="status"></p>
      <img id="mascot" class="mascot" alt="" width="220" height="220">
    </section>

    <section id="clock" class="clock">
      <div><span id="deadline-label"></span><strong id="countdown"></strong></div>
      <div class="clock-side"><span id="status-label" class="badge"></span><small id="estimate"></small></div>
    </section>

    <div class="progress"><div class="track"><div id="progress-bar"></div></div><span id="progress-text"></span></div>
    <p id="spare" class="spare" hidden></p>
    <img id="duo" class="duo" src="./mascots/duo-walk.webp" alt="Le renard et le lapin en route" width="300" height="300" hidden>
    <ol id="steps" class="steps"></ol>
    <button id="reset-day" class="link" type="button">Recommencer la routine</button>
  </main>

  <main id="settings" hidden>
    <h1>Réglages</h1>
    <section class="panel">
      <h2>La famille</h2>
      <div id="member-list"></div>
      <button id="add-member" class="button secondary" type="button">+ Ajouter un enfant</button>
    </section>
    <section class="panel">
      <h2>Routines</h2>
      <label class="inline"><input id="holidays" type="checkbox"> Mode vacances</label>
      <div id="routine-list"></div>
      <button id="reset-config" class="link" type="button">Revenir aux routines par défaut</button>
    </section>
    <div class="save-bar">
      <button id="cancel-settings" class="button secondary" type="button">Annuler</button>
      <button id="save-settings" class="button" type="button">Enregistrer</button>
    </div>
    <details class="panel">
      <summary>Centrale C6 (expérimental)</summary>
      <p class="muted">Les routines restent sur cet appareil : elles ne sont pas encore synchronisées avec la C6.</p>
      <label class="field"><span>Adresse locale</span><input id="server-url" type="url" placeholder="http://192.168.1.50"></label>
      <button id="save-server" class="button secondary" type="button">Tester la connexion</button>
      <p id="server-state" role="status">Non configurée</p>
      <label class="field"><span>Message partagé</span><textarea id="shared-value" rows="2" maxlength="256"></textarea></label>
      <button id="save-value" class="button" type="button" disabled>Envoyer</button>
      <p id="value-status" class="muted" role="status"></p>
    </details>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
